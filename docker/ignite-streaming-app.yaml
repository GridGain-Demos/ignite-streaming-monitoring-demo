services:
  ignite-streaming-app:
    image: ignite-streaming-app
    # Docker compiles the app from source (see docker/StreamingAppDockerfile),
    # so "docker compose ... up -d --build" needs no local JDK or Maven.
    # context is the repo root (the compose file lives in docker/).
    build:
      context: ..
      dockerfile: docker/StreamingAppDockerfile
    container_name: ignite-streaming-app
    deploy:
      resources:
        limits:
          cpus: '1'
        reservations:
          cpus: '0.50'
    environment:
      - IGNITE_WORK_DIR=/opt/ignite/work
      - execTime=150
      - DISCOVERY_ADDRS=docker-ignite-server-node-1:47500..47502,docker-ignite-server-node-2:47500..47502
    networks:
      - ignite-net
    volumes:
      - ../work:/opt/ignite/work

networks:
  ignite-net:
    driver: bridge
