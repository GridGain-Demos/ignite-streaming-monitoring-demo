services:
  backend:
    image: gridgain/control-center-backend:2026.1
    container_name: control-center-backend
    # Restart on crash.
    restart: on-failure
    networks:
      - ignite-net

  frontend:
    image: gridgain/control-center-frontend:2026.1
    container_name: control-center-frontend
    depends_on:
      - backend
    ports:
      # Control Center UI (HOST_PORT:CONTAINER_PORT). The frontend image already
      # contains the nginx config that listens on 8008 and proxies to
      # control-center-backend:3000, so no config file needs to be mounted.
      - 8008:8008
    networks:
      - ignite-net

networks:
  ignite-net:
    driver: bridge
