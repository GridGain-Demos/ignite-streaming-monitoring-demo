services:
  control-center-backend:
    image: gridgain/control-center-backend:2026.1
    container_name: control-center-backend
    # Restart on crash.
    restart: on-failure
    networks:
      - ignite-net

  control-center-frontend:
    image: gridgain/control-center-frontend:2026.1
    container_name: control-center-frontend
    depends_on:
      - control-center-backend
    ports:
      # Browser access to Control Center (HOST_PORT:CONTAINER_PORT). The frontend
      # nginx serves the UI on 8008 and proxies /api, /agents, and /browsers to
      # control-center-backend:3000. The backend container name must stay
      # "control-center-backend" because the shipped nginx upstream points at it.
      - 8008:8008
    networks:
      - ignite-net

networks:
  ignite-net:
    driver: bridge
